<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Warm Cream Background Gradient -->
    <linearGradient id="gl-creamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF8F2" />
      <stop offset="50%" stop-color="#F7EFE2" />
      <stop offset="100%" stop-color="#F1E4D0" />
    </linearGradient>

    <!-- Subtle Warm Border Gradient -->
    <linearGradient id="gl-warmBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAD8BE" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#D9C2A0" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#E2CCA8" stop-opacity="0.75" />
    </linearGradient>

    <!-- Light Variant Roof: Deep Emerald & Teal -->
    <linearGradient id="gl-leftRoof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#149A84" />
      <stop offset="40%" stop-color="#0E7E6C" />
      <stop offset="100%" stop-color="#095C4F" />
    </linearGradient>

    <linearGradient id="gl-rightRoof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B6657" />
      <stop offset="45%" stop-color="#074D41" />
      <stop offset="100%" stop-color="#04362E" />
    </linearGradient>

    <!-- Gold Flag & Wings Gradient -->
    <linearGradient id="gl-goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C442" />
      <stop offset="35%" stop-color="#E2A622" />
      <stop offset="100%" stop-color="#C07C0A" />
    </linearGradient>

    <!-- People Fill: Rich Deep Emerald -->
    <linearGradient id="gl-peopleEmerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D6B5D" />
      <stop offset="100%" stop-color="#07473D" />
    </linearGradient>

    <!-- Soft drop shadow for roof in light mode -->
    <filter id="gl-roofShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#042620" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#gl-creamBg)" stroke="url(#gl-warmBorder)" stroke-width="2.5" />

  <!-- Flagpole -->
  <line x1="256" y1="120" x2="256" y2="74" stroke="url(#gl-goldGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- Golden Flag (waving right) -->
  <path
    d="M 256 78
       C 285 70, 314 84, 338 86
       C 334 98, 335 110, 328 120
       C 300 116, 276 100, 256 112
       Z"
    fill="url(#gl-goldGrad)"
  />

  <!-- Pavilion Roof Left Half -->
  <path
    d="M 256 122
       C 192 144, 116 186, 44 232
       C 100 244, 185 236, 256 215
       Z"
    fill="url(#gl-leftRoof)"
    filter="url(#gl-roofShadow)"
  />

  <!-- Pavilion Roof Right Half -->
  <path
    d="M 256 122
       C 320 144, 396 186, 468 232
       C 412 244, 327 236, 256 215
       Z"
    fill="url(#gl-rightRoof)"
    filter="url(#gl-roofShadow)"
  />

  <!-- Left Golden Curved Side Wing / Cradle -->
  <path
    d="M 52 234
       C 46 295, 78 376, 238 396
       C 194 390, 108 362, 88 300
       C 78 268, 78 244, 88 234
       Z"
    fill="url(#gl-goldGrad)"
  />

  <!-- Right Golden Curved Side Wing / Cradle -->
  <path
    d="M 460 234
       C 466 295, 434 376, 274 396
       C 318 390, 404 362, 424 300
       C 434 268, 434 244, 424 234
       Z"
    fill="url(#gl-goldGrad)"
  />

  <!-- Center Person (Host / Leader) -->
  <circle cx="256" cy="265" r="32" fill="url(#gl-peopleEmerald)" />
  <path
    d="M 216 384
       C 216 308, 296 308, 296 384
       C 296 390, 216 390, 216 384
       Z"
    fill="url(#gl-peopleEmerald)"
  />

  <!-- Left Person -->
  <circle cx="178" cy="292" r="23" fill="url(#gl-peopleEmerald)" />
  <path
    d="M 148 382
       C 148 326, 206 326, 206 382
       C 206 386, 148 386, 148 382
       Z"
    fill="url(#gl-peopleEmerald)"
  />

  <!-- Right Person -->
  <circle cx="334" cy="292" r="23" fill="url(#gl-peopleEmerald)" />
  <path
    d="M 306 382
       C 306 326, 364 326, 364 382
       C 364 386, 306 386, 306 382
       Z"
    fill="url(#gl-peopleEmerald)"
  />
</svg>