<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Emerald Background Gradient -->
    <linearGradient id="g-emeraldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#043128" />
      <stop offset="45%" stop-color="#02241D" />
      <stop offset="100%" stop-color="#011410" />
    </linearGradient>

    <!-- Subtle Gold Border Gradient -->
    <linearGradient id="g-goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E1A4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#B88A35" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#EED58D" stop-opacity="0.75" />
    </linearGradient>

    <!-- Left Roof: Vibrant Turquoise to Teal Gradient -->
    <linearGradient id="g-leftRoof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3EE7C6" />
      <stop offset="35%" stop-color="#24CDAB" />
      <stop offset="100%" stop-color="#129983" />
    </linearGradient>

    <!-- Right Roof: Teal to Deep Emerald Gradient -->
    <linearGradient id="g-rightRoof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A590" />
      <stop offset="45%" stop-color="#0F7A69" />
      <stop offset="100%" stop-color="#075044" />
    </linearGradient>

    <!-- Gold Flag & Wings Gradient -->
    <linearGradient id="g-goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDDC72" />
      <stop offset="35%" stop-color="#F5BD38" />
      <stop offset="100%" stop-color="#D69117" />
    </linearGradient>

    <!-- People Fill: Warm Ivory -->
    <linearGradient id="g-peopleIvory" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9EE" />
      <stop offset="100%" stop-color="#F6E7CF" />
    </linearGradient>

    <!-- Drop Shadow under roof -->
    <filter id="g-roofShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#g-emeraldBg)" stroke="url(#g-goldBorder)" stroke-width="2.5" />

  <!-- Flagpole -->
  <line x1="256" y1="120" x2="256" y2="74" stroke="url(#g-goldGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- Golden Flag (waving right) -->
  <path
    d="M 256 78
       C 285 70, 314 84, 338 86
       C 334 98, 335 110, 328 120
       C 300 116, 276 100, 256 112
       Z"
    fill="url(#g-goldGrad)"
  />

  <!-- Pavilion Roof Left Half -->
  <path
    d="M 256 122
       C 192 144, 116 186, 44 232
       C 100 244, 185 236, 256 215
       Z"
    fill="url(#g-leftRoof)"
    filter="url(#g-roofShadow)"
  />

  <!-- Pavilion Roof Right Half -->
  <path
    d="M 256 122
       C 320 144, 396 186, 468 232
       C 412 244, 327 236, 256 215
       Z"
    fill="url(#g-rightRoof)"
    filter="url(#g-roofShadow)"
  />

  <!-- Left Golden Curved Side Wing / Cradle -->
  <path
    d="M 52 234
       C 46 295, 78 376, 238 396
       C 194 390, 108 362, 88 300
       C 78 268, 78 244, 88 234
       Z"
    fill="url(#g-goldGrad)"
  />

  <!-- Right Golden Curved Side Wing / Cradle -->
  <path
    d="M 460 234
       C 466 295, 434 376, 274 396
       C 318 390, 404 362, 424 300
       C 434 268, 434 244, 424 234
       Z"
    fill="url(#g-goldGrad)"
  />

  <!-- Center Person (Host / Leader) -->
  <circle cx="256" cy="265" r="32" fill="url(#g-peopleIvory)" />
  <path
    d="M 216 384
       C 216 308, 296 308, 296 384
       C 296 390, 216 390, 216 384
       Z"
    fill="url(#g-peopleIvory)"
  />

  <!-- Left Person -->
  <circle cx="178" cy="292" r="23" fill="url(#g-peopleIvory)" />
  <path
    d="M 148 382
       C 148 326, 206 326, 206 382
       C 206 386, 148 386, 148 382
       Z"
    fill="url(#g-peopleIvory)"
  />

  <!-- Right Person -->
  <circle cx="334" cy="292" r="23" fill="url(#g-peopleIvory)" />
  <path
    d="M 306 382
       C 306 326, 364 326, 364 382
       C 364 386, 306 386, 306 382
       Z"
    fill="url(#g-peopleIvory)"
  />
</svg>